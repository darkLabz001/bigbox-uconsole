# bigbox input config — uConsole edition.
#
# The uConsole controller is a single STM32 composite USB-HID device that
# always exposes three interfaces at once: a QWERTY keyboard (the M11..M88
# matrix), a mouse (trackball), and a gamepad (D-pad / A·B·X·Y / Select·
# Start). This file maps input to logical Buttons:
#
#   UP DOWN LEFT RIGHT A B X Y START SELECT HK LL RR
#
# * [keymap] maps pygame keysyms (the QWERTY + keysym-mode gamepad: arrows,
#   j/k/u/i, Space/Enter, L/R = Left/Right Shift — bigbox/input/keyboard.py)
# * [joystick] maps the gamepad interface's evdev codes
#   (bigbox/input/joystick.py)
#
# Override any default by editing below. Keys are pygame keysym names
# (lower-cased, without the `K_` prefix). For a hand-tuned copy that
# survives OTA, put your file at /etc/bigbox/buttons.toml.
#
# Example: bind the keyboard's `=` key (a common spot if you've remapped
# something) to the HK overlay button.
#
# [keymap]
# "equals" = "HK"

[keymap]

# --- Native gamepad (USB-HID joystick) input --------------------------------
# The uConsole's controller is a single STM32 composite device that always
# exposes a QWERTY keyboard, a mouse (trackball) and a gamepad together.
# With the rear PD2 switch LOW the gamepad area reports a USB joystick:
#
#   D-pad   = ABS_X/ABS_Y axes   0..1023, neutral 511
#   X / A / B / Y = joystick buttons 1..4  -> BTN_TRIGGER / BTN_THUMB /
#                                            BTN_THUMB2 / BTN_TOP
#   Select / Start = joystick buttons 9/10  -> BTN_BASE3 / BTN_BASE4
#
# L/R are keyboard Left/Right Shift in BOTH switch positions (they live on
# the keyboard interface, not the joystick), so they bind in [keymap] below,
# never in [joystick]. With PD2 HIGH the gamepad area sends keysyms instead
# (arrows, j/k/u/i, Space, Enter) and the joystick section is simply unused.
#
# Defaults already map the stock codes above; only override if you've
# reflashed the keyboard with custom/QMK firmware and the button order
# differs. Keys are evdev code names (or raw ints), values are Button names.
#
#   [joystick]
#   enabled  = true
#   devnode  = ""            # "/dev/input/eventN" to pin a device
#   dpad     = "auto"        # auto|hat0|hat1|buttons|stick|both
#   deadzone = 0.15          # for a stick-sourced D-pad (0..0.9)
#   "BTN_TRIGGER" = "X"      # stock uConsole codes:
#   "BTN_THUMB"   = "A"
#   "BTN_THUMB2"  = "B"
#   "BTN_TOP"     = "Y"
#   "BTN_BASE3"   = "SELECT"
#   "BTN_BASE4"   = "START"
[joystick]

# --- Behavior tunables --------------------------------------------------------
# These still apply: GPIO repeat behavior is handled differently for
# keyboards (the kernel auto-repeats KEYDOWN events for you), but bigbox
# uses these for any synthetic-repeat fallbacks.
[behavior]
debounce_ms        = 30
repeat_delay_ms    = 400
repeat_interval_ms = 90
